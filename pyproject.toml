[project]
name = "mihari"
version = "0.1.0"
description = "スタックチャンの見張り番: 首を振って部屋を見回し、人物検出 AI で人を見つけて振り向き、温湿度でエアコンの操作を判断する"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "pillow>=10",
    "opencv-python>=4.9",
    "websockets>=12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mihari = "mihari.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
